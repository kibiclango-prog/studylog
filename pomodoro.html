<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191f" media="(prefers-color-scheme: dark)">
<title>Pomodoro</title>
<style>
  :root {
    --bg: #f5f2ec;
    --bg2: #ede9e1;
    --card: #ffffff;
    --text: #2a2520;
    --text2: #5a5248;
    --text3: #8a8078;
    --border: #d8d3ca;
    --work: #c8723a;
    --break: #2d5a3d;
    --mode: var(--work);
    --mono: ui-monospace, 'SF Mono', 'DM Mono', Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191f;
      --bg2: #20242c;
      --card: #262b34;
      --text: #ece8e1;
      --text2: #b8b1a6;
      --text3: #857e74;
      --border: #363c47;
      --work: #e08a52;
      --break: #5fae7d;
    }
  }
  body[data-mode="break"] { --mode: var(--break); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    display: flex; flex-direction: column; align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--mode); outline-offset: 2px; }

  .wrap { width: 100%; max-width: 420px; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 3vh, 24px); }

  /* mode tabs */
  .modes { display: flex; gap: 2px; padding: 3px; background: var(--bg2); border-radius: 10px; width: 100%; }
  .mode-btn { flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 13px; color: var(--text2); white-space: nowrap; transition: background .15s, color .15s; }
  .mode-btn[aria-pressed="true"] { background: var(--card); color: var(--mode); font-weight: 700; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  /* ring */
  .ring-box { position: relative; width: min(72vw, 46vh, 300px); aspect-ratio: 1; }
  .ring-box svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { stroke: var(--bg2); }
  .ring-fg { stroke: var(--mode); stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .3s; }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .clock { font-family: var(--mono); font-size: clamp(36px, min(16vw, 10vh), 64px); font-weight: 300; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1; user-select: none; }
  .mode-label { font-size: 12px; color: var(--mode); font-weight: 700; letter-spacing: .08em; }
  body.paused .clock { opacity: .55; }

  .today { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .today strong { color: var(--text); font-weight: 500; }

  /* controls */
  .controls { display: flex; align-items: center; justify-content: center; gap: 16px; width: 100%; }
  .main-btn { flex: 0 1 180px; height: 56px; border-radius: 28px; background: var(--mode); color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .04em; transition: transform .1s, background .3s; }
  .main-btn:active { transform: scale(.96); }
  .sub-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--bg2); color: var(--text2); display: grid; place-items: center; flex-shrink: 0; }
  .sub-btn:active { transform: scale(.94); }
  .sub-btn svg { width: 20px; height: 20px; }

  .bottom { display: flex; gap: 8px; align-items: center; justify-content: center; }
  .link-btn { font-size: 12px; color: var(--text3); padding: 6px 10px; border-radius: 6px; }
  .link-btn:hover { background: var(--bg2); }

  /* settings sheet */
  dialog { margin: auto; border: none; border-radius: 16px; background: var(--card); color: var(--text); width: min(92vw, 380px); max-height: 90vh; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { font-size: 15px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .row:last-of-type { border-bottom: none; }
  .row input[type=number] { width: 72px; padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 15px; text-align: right; }
  .row input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--mode); }
  .unit { color: var(--text3); font-size: 12px; margin-left: 4px; }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .dialog-actions button { padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; }
  .btn-ghost { background: var(--bg2); color: var(--text2); }
  .btn-ok { background: var(--mode); color: #fff; }

  /* very small / short windows: hide extras, go horizontal */
  @media (max-height: 520px) {
    .bottom { display: none; }
    .main-btn { height: 46px; }
    .sub-btn { width: 40px; height: 40px; }
  }
  @media (max-height: 420px) and (min-aspect-ratio: 1/1) {
    .wrap { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto 1fr 1fr; gap: 8px 20px; max-width: 640px; align-items: center; }
    .modes { grid-column: 1 / -1; }
    .ring-box { grid-row: 2 / 4; width: min(60vh, 42vw); }
    .today { display: block; align-self: end; text-align: center; }
    .controls { align-self: start; }
  }
  @media (max-height: 300px) {
    .modes, .today { display: none; }
    .wrap { grid-template-rows: 1fr auto; }
    .ring-box { grid-row: 1 / 3; width: min(78vh, 42vw); }
    .controls { grid-row: 1 / 3; align-self: center; }
  }
  @media (max-width: 300px) {
    .controls { gap: 10px; }
    .mode-btn { font-size: 11px; }
  }
</style>
</head>
<body data-mode="work">
<main class="wrap">
  <div class="modes" role="group" aria-label="時間の形式">
    <button class="mode-btn" data-preset="25" aria-pressed="true">25分 / 5分</button>
    <button class="mode-btn" data-preset="50" aria-pressed="false">50分 / 10分</button>
  </div>

  <div class="ring-box">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring-bg" cx="50" cy="50" r="45" fill="none" stroke-width="5"/>
      <circle class="ring-fg" id="ring" cx="50" cy="50" r="45" fill="none" stroke-width="5"/>
    </svg>
    <div class="ring-center">
      <div class="clock" id="clock" role="timer" aria-live="off">25:00</div>
      <div class="mode-label" id="mode-label">集中</div>
    </div>
  </div>

  <div class="today">今日 <strong id="today-count">0</strong> 回 · <strong id="today-min">0</strong> 分</div>

  <div class="controls">
    <button class="sub-btn" id="btn-reset" aria-label="リセット" title="リセット">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="main-btn" id="btn-main">スタート</button>
    <button class="sub-btn" id="btn-skip" aria-label="次へスキップ" title="スキップ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l10 7-10 7z"/><path d="M19 5v14"/></svg>
    </button>
  </div>

  <div class="bottom">
    <button class="link-btn" id="btn-settings">⚙ 設定</button>
    <a class="link-btn" href="index.html" style="text-decoration:none">← StudyLog</a>
  </div>
</main>

<dialog id="settings">
  <form method="dialog" id="settings-form">
    <h2>設定</h2>
    <label class="row">次を自動スタート<input type="checkbox" name="auto"></label>
    <label class="row">音を鳴らす<input type="checkbox" name="sound"></label>
    <label class="row">通知を出す<input type="checkbox" name="notify"></label>
    <div class="dialog-actions">
      <button type="button" class="btn-ghost" id="btn-cancel">キャンセル</button>
      <button type="submit" class="btn-ok">保存</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'pomodoro_v1';
const LABEL = { work: '集中', break: '休憩' };
const PRESETS = { '25': { work: 25, break: 5 }, '50': { work: 50, break: 10 } };
const DEFAULTS = { preset: '25', auto: false, sound: true, notify: false };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r) return r; } catch (e) {}
  return {};
}
const saved = load();
const settings = { ...DEFAULTS, ...saved.settings };
if (!PRESETS[settings.preset]) settings.preset = DEFAULTS.preset;
// timer state: endAt (ms) while running, remaining (ms) while paused/idle
let st = { mode: 'work', running: false, endAt: 0, remaining: PRESETS[settings.preset].work * 60000, ...saved.st };
if (!LABEL[st.mode]) { st = { mode: 'work', running: false, endAt: 0, remaining: PRESETS[settings.preset].work * 60000 }; }
let log = saved.log && saved.log.date === todayStr() ? saved.log : { date: todayStr(), count: 0, min: 0 };

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify({ settings, st, log })); } catch (e) {}
}

const minutesOf = mode => PRESETS[settings.preset][mode];
const durationOf = mode => minutesOf(mode) * 60000;
const remainingNow = () => st.running ? Math.max(0, st.endAt - Date.now()) : st.remaining;

// ── render ──
const ring = $('ring'), C = 2 * Math.PI * 45;
ring.style.strokeDasharray = C;

function render() {
  const rem = remainingNow();
  const s = Math.ceil(rem / 1000);
  const text = `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  $('clock').textContent = text;
  const frac = 1 - rem / durationOf(st.mode);
  ring.style.strokeDashoffset = C * Math.min(1, Math.max(0, frac));
  document.title = st.running || rem < durationOf(st.mode) ? `${text} ${LABEL[st.mode]}` : 'Pomodoro';
}

function renderStatic() {
  document.body.dataset.mode = st.mode;
  document.body.classList.toggle('paused', !st.running && st.remaining < durationOf(st.mode));
  document.querySelectorAll('.mode-btn').forEach(b => b.setAttribute('aria-pressed', b.dataset.preset === settings.preset));
  $('mode-label').textContent = LABEL[st.mode];
  $('btn-main').textContent = st.running ? '一時停止' : (st.remaining < durationOf(st.mode) ? '再開' : 'スタート');
  if (log.date !== todayStr()) log = { date: todayStr(), count: 0, min: 0 };
  $('today-count').textContent = log.count;
  $('today-min').textContent = log.min;
  render();
}

// ── control ──
let tick = null;
function startTick() { clearInterval(tick); tick = setInterval(onTick, 250); }

function start() {
  if (st.running) return;
  if (st.remaining <= 0) st.remaining = durationOf(st.mode);
  st.endAt = Date.now() + st.remaining;
  st.running = true;
  unlockAudio(); requestWakeLock();
  startTick(); persist(); renderStatic();
}
function pause() {
  if (!st.running) return;
  st.remaining = remainingNow();
  st.running = false;
  clearInterval(tick); releaseWakeLock();
  persist(); renderStatic();
}
function setMode(mode, autoStart = false) {
  clearInterval(tick);
  st.mode = mode; st.running = false; st.remaining = durationOf(mode);
  if (autoStart) start(); else { releaseWakeLock(); persist(); renderStatic(); }
}
const nextMode = () => st.mode === 'work' ? 'break' : 'work';
function complete() {
  if (st.mode === 'work') {
    if (log.date !== todayStr()) log = { date: todayStr(), count: 0, min: 0 };
    log.count++; log.min += minutesOf('work');
  }
  const next = nextMode();
  alertDone(st.mode, next);
  setMode(next, settings.auto);
}
// skipping a focus block doesn't count it
function skip() { setMode(nextMode(), st.running && settings.auto); }
function reset() { setMode(st.mode); }
function setPreset(preset) {
  settings.preset = preset;
  setMode('work');
}
function onTick() {
  if (remainingNow() <= 0) complete(); else render();
}

$('btn-main').addEventListener('click', () => st.running ? pause() : start());
$('btn-skip').addEventListener('click', skip);
$('btn-reset').addEventListener('click', reset);
document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.preset === settings.preset) return;
  if (st.running && !confirm('タイマーを止めて切り替えますか？')) return;
  setPreset(b.dataset.preset);
}));
document.addEventListener('keydown', e => {
  if (e.target.closest('dialog')) return;
  if (e.code === 'Space') { e.preventDefault(); st.running ? pause() : start(); }
  else if (e.key === 'r') reset();
  else if (e.key === 's') skip();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (st.running) { onTick(); requestWakeLock(); }
    renderStatic();
  }
});

// ── alerts ──
let actx = null;
function unlockAudio() {
  if (!settings.sound) return;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
}
function beep() {
  if (!settings.sound || !actx) return;
  const t0 = actx.currentTime;
  [0, 0.25, 0.5].forEach((dt, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
    g.gain.setValueAtTime(0.0001, t0 + dt);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + dt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.22);
    o.connect(g).connect(actx.destination);
    o.start(t0 + dt); o.stop(t0 + dt + 0.25);
  });
}
function alertDone(done, next) {
  beep();
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  if (settings.notify && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(`${LABEL[done]} 終了`, { body: `次は${LABEL[next]}（${minutesOf(next)}分）`, tag: 'pomodoro' }); } catch (e) {}
  }
}

let wakeLock = null;
async function requestWakeLock() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {}
}
function releaseWakeLock() { try { wakeLock && wakeLock.release(); } catch (e) {} wakeLock = null; }

// ── settings ──
const dlg = $('settings'), form = $('settings-form');
$('btn-settings').addEventListener('click', () => {
  for (const k of ['auto', 'sound', 'notify']) form.elements[k].checked = settings[k];
  dlg.showModal();
});
$('btn-cancel').addEventListener('click', () => dlg.close());
form.addEventListener('submit', async () => {
  for (const k of ['auto', 'sound', 'notify']) settings[k] = form.elements[k].checked;
  if (settings.notify && 'Notification' in window && Notification.permission === 'default') {
    try { await Notification.requestPermission(); } catch (e) {}
  }
  persist(); renderStatic();
});

// ── window position/size: remember where the app window was and put it back ──
// Only in the desktop shortcut's app window (opened with ?app); a normal tab can't be moved.
const WIN_KEY = 'pomodoro_window';
const isAppWindow = new URLSearchParams(location.search).has('app') || !window.locationbar.visible;
const winBounds = () => ({ x: window.screenX, y: window.screenY, w: window.outerWidth, h: window.outerHeight });
function restoreWindow() {
  let b; try { b = JSON.parse(localStorage.getItem(WIN_KEY)); } catch (e) {}
  if (!b || b.w < 150 || b.h < 150) return;
  try { window.resizeTo(b.w, b.h); window.moveTo(b.x, b.y); } catch (e) {}
}
let lastWin = '';
function saveWindow() {
  const s = JSON.stringify(winBounds());
  if (s === lastWin) return;
  lastWin = s;
  try { localStorage.setItem(WIN_KEY, s); } catch (e) {}
}
if (isAppWindow) {
  restoreWindow();
  // moving a window fires no event, so check once a second (after the restore has settled)
  setTimeout(() => { lastWin = JSON.stringify(winBounds()); setInterval(saveWindow, 1000); }, 1500);
  window.addEventListener('pagehide', saveWindow);
}

// ── boot: resume a running timer after reload ──
if (st.running) {
  if (remainingNow() <= 0) { complete(); } else { startTick(); requestWakeLock(); }
}
renderStatic();
</script>
</body>
</html>
