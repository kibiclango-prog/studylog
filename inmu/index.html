<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InmuLM</title>
<style>
  :root {
    --bg: #f5f2ec; --panel: #ffffff; --text: #2a2520; --text2: #8a8078;
    --border: #d8d3ca; --me: #1a2540; --me-text: #ffffff; --bot: #ede9e1; --accent: #c8723a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d; --panel: #1f2229; --text: #e8e4dc; --text2: #9a948a;
      --border: #333741; --me: #3a5a8c; --me-text: #ffffff; --bot: #2a2e37; --accent: #e08a50;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px; }
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  .sub { color: var(--text2); font-size: 12px; }
  .temp { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .temp input { width: 90px; accent-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .bot.typing::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #chips { display: flex; gap: 6px; padding: 0 16px 8px; overflow-x: auto; }
  #chips button { flex-shrink: 0; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 10px 16px 16px; border-top: 1px solid var(--border); }
  form input { flex: 1; min-width: 0; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 15px; }
  form button { padding: 0 18px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  form button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Inmu<span>LM</span></h1>
      <div class="sub">語録しかしゃべれない、かるめの言語モデル（語彙 <span id="vocab"></span> 語録）</div>
    </div>
    <label class="temp">温度 <input id="temp" type="range" min="0.1" max="1.5" step="0.1" value="0.7"><b id="tempv">0.7</b></label>
  </header>
  <div id="log"></div>
  <div id="chips"></div>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="なんか話しかけて、どうぞ" enterkeyhint="send">
    <button id="send">送信</button>
  </form>
</div>
<script src="model.js"></script>
<script>
  const lm = new InmuLM();
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), send = $('send');
  $('vocab').textContent = InmuLM.PHRASES.length;

  $('temp').addEventListener('input', (e) => {
    lm.temperature = parseFloat(e.target.value);
    $('tempv').textContent = e.target.value;
  });

  function bubble(cls, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  // LLM っぽく 1 文字ずつ流す
  async function stream(text) {
    const el = bubble('bot typing', '');
    await new Promise((r) => setTimeout(r, 250 + Math.random() * 300));
    for (const ch of text) {
      el.textContent += ch;
      log.scrollTop = log.scrollHeight;
      await new Promise((r) => setTimeout(r, 35));
    }
    el.classList.remove('typing');
  }

  let busy = false;
  async function ask(text) {
    if (busy) return;
    busy = true; send.disabled = true;
    bubble('me', text || '（無言）');
    await stream(lm.generate(text).join('\n'));
    busy = false; send.disabled = false;
    input.focus();
  }

  $('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    input.value = '';
    ask(text);
  });

  ['こんにちは！', 'あなた誰？', '疲れた…', 'お腹すいた', 'テスト合格した！', '許して！何でもしますから！', '1+1は？']
    .forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = t;
      b.onclick = () => ask(t);
      $('chips').appendChild(b);
    });

  stream('はい、ヨロシクゥ！');
</script>
</body>
</html>
